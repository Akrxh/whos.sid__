name: Update Instagram Stats

on:
  schedule:
    - cron: '0 * * * *'  # Run every hour at the top of the hour
  workflow_dispatch:  # Allow manual trigger from Actions tab

jobs:
  update-stats:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4
      
      - name: Fetch Instagram stats
        run: |
          python << 'EOF'
          import json
          import requests
          from bs4 import BeautifulSoup
          
          def fetch_instagram_stats(username):
              """Fetch Instagram stats by scraping public profile"""
              try:
                  # Fetch Instagram profile page
                  url = f"https://www.instagram.com/{username}/"
                  headers = {
                      'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
                  }
                  
                  response = requests.get(url, headers=headers, timeout=10)
                  response.raise_for_status()
                  
                  # Extract JSON data from page
                  soup = BeautifulSoup(response.content, 'html.parser')
                  
                  # Find script containing profile data
                  scripts = soup.find_all('script', {'type': 'application/ld+json'})
                  
                  if scripts:
                      for script in scripts:
                          data = json.loads(script.string)
                          if data.get('@type') == 'Person' and data.get('name') == username:
                              stats = {
                                  "posts": str(data.get('interactionStatistic', [{}])[0].get('userInteractionCount', '0')),
                                  "followers": str(data.get('interactionStatistic', [{}])[1].get('userInteractionCount', '0') if len(data.get('interactionStatistic', [])) > 1 else '0'),
                                  "following": str(data.get('interactionStatistic', [{}])[2].get('userInteractionCount', '0') if len(data.get('interactionStatistic', [])) > 2 else '0')
                              }
                              return stats
                  
                  # Fallback: extract from meta tags
                  og_description = soup.find('meta', {'property': 'og:description'})
                  if og_description:
                      desc = og_description.get('content', '')
                      # Parse description like "123 Followers, 456 Following, 789 Posts"
                      parts = desc.split(' • ')
                      if len(parts) >= 3:
                          try:
                              followers = parts[0].split()[0].replace(',', '')
                              following = parts[1].split()[0].replace(',', '')
                              posts = parts[2].split()[0].replace(',', '')
                              return {
                                  "posts": posts,
                                  "followers": followers,
                                  "following": following
                              }
                          except:
                              pass
                  
                  return None
                  
              except Exception as e:
                  print(f"Error fetching Instagram stats: {e}")
                  return None
          
          # Fetch stats
          username = 'whos.sid__'
          stats = fetch_instagram_stats(username)
          
          if stats:
              # Write to data.json
              with open('data.json', 'w') as f:
                  json.dump(stats, f, indent=2)
              print(f"✅ Successfully updated stats: {stats}")
          else:
              print(f"⚠️  Could not fetch Instagram stats for {username}")
              # Don't exit(1) so workflow doesn't fail - Instagram may block requests
          EOF
      
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data.json
          
          # Only commit if there are changes
          if ! git diff --quiet; then
            git commit -m "🔄 Update Instagram stats - $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          else
            echo "No changes to commit"
          fi
