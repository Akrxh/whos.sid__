name: Update Instagram Stats

on:
  schedule:
    - cron: '0 * * * *'  # Run every hour at the top of the hour
  workflow_dispatch:  # Allow manual trigger from Actions tab

jobs:
  update-stats:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install instagrapi requests
      
      - name: Fetch Instagram stats
        run: |
          python << 'EOF'
          import json
          from instagrapi import Client
          
          def fetch_instagram_stats(username):
              """Fetch Instagram stats using instagrapi"""
              try:
                  # Create anonymous client
                  cl = Client()
                  
                  # Fetch user info by username
                  user = cl.user_info_by_username(username)
                  
                  # Extract stats
                  stats = {
                      "posts": str(user.media_count),
                      "following": str(user.following_count),
                      "followers": str(user.follower_count)
                  }
                  
                  return stats
                  
              except Exception as e:
                  print(f"Error fetching Instagram stats: {e}")
                  return None
          
          # Fetch stats
          username = 'whos.sid__'
          stats = fetch_instagram_stats(username)
          
          if stats:
              # Write to data.json
              with open('data.json', 'w') as f:
                  json.dump(stats, f, indent=2)
              print(f"✅ Successfully updated stats: {stats}")
          else:
              print(f"❌ Failed to fetch Instagram stats for {username}")
              exit(1)
          EOF
      
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data.json
          
          # Only commit if there are changes
          if ! git diff --quiet; then
            git commit -m "🔄 Update Instagram stats - $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          else
            echo "No changes to commit"
          fi
